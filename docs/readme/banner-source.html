<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ری‌بوک — جلد چاپی مدرن</title>
<style>
@font-face{font-family:Vazirmatn;src:url('../../frontend/node_modules/vazirmatn/misc/Farsi-Digits/fonts/webfonts/Vazirmatn-FD-Regular.woff2');font-weight:400}
@font-face{font-family:Vazirmatn;src:url('../../frontend/node_modules/vazirmatn/misc/Farsi-Digits/fonts/webfonts/Vazirmatn-FD-Medium.woff2');font-weight:500}
*{box-sizing:border-box}html,body{width:1440px;height:560px;overflow:hidden}body{margin:0;background:#480217;color:#F5F5F2;font-family:Vazirmatn,Tahoma,sans-serif}
.poster{position:relative;width:1440px;height:560px;overflow:hidden;background:radial-gradient(ellipse at 27% 5%,#87394C 0,#6E172C 43%,#480217 100%)}
.masthead{position:absolute;inset:36px 56px auto;display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #F6C2C63D;padding-bottom:17px;font-size:17px;color:#E7C4C7}
.latin{direction:ltr;font-size:17px}.copy{position:absolute;right:68px;top:113px;width:640px}
.wordmark{margin:0;line-height:0}.brand-logo{display:block;width:600px;height:auto;margin-inline-end:auto}
.lead{margin:14px 0 0;font-size:31px;line-height:1.75;white-space:nowrap}.lead span{color:#F6C2C6}
.imprint{--key-edge:color-mix(in oklab,#448061 55%,#000);display:inline-flex;align-items:center;justify-content:center;min-height:68px;margin-top:22px;padding:13px 30px;background-color:#448061;background-image:linear-gradient(color-mix(in srgb,#FFFFFF 24%,transparent),color-mix(in srgb,#FFFFFF 24%,transparent)),linear-gradient(transparent,color-mix(in srgb,#000 12%,transparent));background-size:100% 1px,100% 100%;background-repeat:no-repeat;border:1px solid #448061;border-radius:4px;font-size:25px;font-weight:500;line-height:1.5;color:#FFFFFF;box-shadow:0 3px 0 var(--key-edge),0 6px 8px -3px color-mix(in srgb,#1A1918 35%,transparent)}
.stage{position:absolute;left:60px;top:100px;width:610px;height:385px}.book{position:absolute;display:block;height:auto;border-radius:2px 5px 5px 2px;box-shadow:0 30px 32px -15px #26000BCC,0 4px 7px #25030D80;outline:1px solid #FFFFFF30;outline-offset:-1px}
.hafez{width:206px;left:36px;top:18px;transform:rotate(-11deg);z-index:1}.owl{width:195px;left:378px;top:20px;transform:rotate(10deg);z-index:2}.prince{width:226px;left:202px;top:44px;transform:rotate(2deg);z-index:3}
.rule{position:absolute;right:68px;bottom:70px;width:640px;height:1px;background:#F6C2C63D}.number{position:absolute;right:68px;bottom:22px;width:640px;font-size:22px;line-height:1.65;white-space:nowrap;color:#E7C4C7}
.edge{position:absolute;bottom:0;left:0;width:100%;height:4px;background:linear-gradient(270deg,#7B4437 0 12.5%,#04556E 12.5% 25%,#553B01 25% 37.5%,#0E2375 37.5% 50%,#863066 50% 62.5%,#005318 62.5% 75%,#4C2C69 75% 87.5%,#1E3507 87.5% 100%)}
</style>
</head>
<body><main class="poster" aria-label="معرفی ری‌بوک؛ خرید و فروش کتاب‌های دست دوم">
<div class="masthead"><span class="latin">ReBook / Second-hand books</span></div>
<div class="copy"><h1 class="wordmark"><img class="brand-logo" src="../../frontend/public/brand/rebook-header-white.svg" width="391" height="126" alt="ری‌بوک"></h1>
<p class="lead">جایی برای دادن <span>زندگی دوباره</span> به کتاب‌ها.</p><span class="imprint">خرید و فروش کتاب‌های دست دوم</span></div>
<div class="stage"><img class="book hafez" src="brand-hafez.webp" width="400" height="600" alt="دیوان حافظ"><img class="book owl" src="brand-owl.webp" width="810" height="1251" alt="بوف کور"><img class="book prince" src="brand-prince.webp" width="750" height="1113" alt="شازده کوچولو"></div>
<span class="rule"></span><span class="number">کتاب بعدی‌ات را پیدا کن، کتاب‌هایی را که خواندی بفروش.</span><div class="edge"></div>
</main></body></html>
